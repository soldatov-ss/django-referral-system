name: Django CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            django-version: "4.2"
            coverage: false
          - python-version: "3.10"
            django-version: "4.2"
            coverage: false
          - python-version: "3.10"
            django-version: "5.0"
            coverage: false
          - python-version: "3.11"
            django-version: "5.1"
            coverage: false
          - python-version: "3.12"
            django-version: "5.1"
            coverage: false
          - python-version: "3.12"
            django-version: "5.2"
            coverage: true
          - python-version: "3.13"
            django-version: "5.2"
            coverage: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Uninstall globally installed referrals (if any)
        run: |
          python -m pip uninstall -y referrals || true  # Uninstall if globally installed

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . "Django~=${{ matrix.django-version }}"

      - name: Set environment variables
        run: echo "BASE_REFERRAL_LINK=http://localhost:8000/" >> $GITHUB_ENV

      - name: Set up the test database
        run: |
          python test_app/manage.py migrate --noinput

      - name: Run tests with coverage
        if: matrix.coverage
        run: |
          pip install 'coverage<8' 'coveralls<4'
          coverage run --source='referrals' test_app/manage.py test referrals
          coverage report
          coverage xml

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: |
          python test_app/manage.py test referrals

      - name: Upload coverage to Coveralls
        if: matrix.coverage
        uses: coverallsapp/github-action@v2.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
